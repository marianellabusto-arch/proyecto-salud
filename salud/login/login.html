<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Bienvenido</h1>
    <p>Iniciá sesión para continuar</p>

    <form id="loginForm">
      <input type="text" id="loginUser" placeholder="Nombre de usuario" required>
      <input type="password" id="loginPass" placeholder="Contraseña" required>
      <button type="submit" class="submit">Entrar</button>
    </form>

    <p class="link" onclick="window.location.href='../registro/registro.html'">
      ¿No tenés cuenta? Crear cuenta
    </p>
  </div>

  <div id="customAlert" class="water-drop-alert hidden">
    <span id="alertMessage"></span>
    <button onclick="cerrarAlerta()">Entendido</button>
  </div>

  <script src="login.js"></script>
</body>
</html>
