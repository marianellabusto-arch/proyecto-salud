<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="registro.css">
</head>
<body>
  <div class="container">
    <h1>Crear Cuenta</h1>
    <form id="registroForm">
      <div class="campo">
        <label>Nombre</label>
        <input type="text" id="nombre" placeholder="Ej: Juan" required>
      </div>

      <div class="campo">
        <label>Apellido</label>
        <input type="text" id="apellido" placeholder="Ej: Pérez" required>
      </div>

      <div class="campo">
        <label>Teléfono</label>
        <input type="tel" id="telefono" placeholder="Ej: 3811234567" required>
      </div>

      <div class="campo">
        <label>Usuario</label>
        <input type="text" id="usuario" placeholder="Tu nombre de usuario" required>
      </div>

      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" id="regEmail" placeholder="ejemplo@gmail.com" required>
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="regPass" placeholder="••••••••" required>
      </div>

      <button type="submit" class="submit">Registrarse</button>
    </form>

    <p class="link" onclick="window.location.href='../login/login.html'">
      ¿Ya tienes cuenta? Inicia sesión
    </p>
  </div>

  <div id="customAlert" class="water-drop-alert hidden">
    <div class="drop-content">
      <div class="water-shine"></div>
      <span id="alertMessage"></span>
      <button onclick="cerrarAlerta()">Entendido</button>
    </div>
  </div>

  <script src="registro.js"></script>
</body>
</html>
